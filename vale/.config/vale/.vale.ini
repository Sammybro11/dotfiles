# Vale configuration for the STE100 prose system.
# Styles are versioned with this repo. Generated data is not.

StylesPath = /Users/samyakrai/dotfiles/vale/styles
MinAlertLevel = warning

# Readability is installed but silent at warning level. Report mode raises the
# alert level to suggestion, which surfaces these metrics for long-form docs.
# They are advisory only: technical nouns inflate every score.
Packages = Readability, \
  ai-tells, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

# Human-facing prose: docs, notes, reports.
[*.md]
BasedOnStyles = Vale, STE, ai-tells, Readability
# American English is the STE100 standard; STE.BritishVariants enforces it.
# Model output rarely misspells, and the default dictionary rejects domain
# terms (qubit, transmon). Vocabulary handling belongs to STE, not spelling.
Vale.Spelling = NO
Vocab = STE
# Advisory metrics: silent at the default warning level, visible in report mode.
Readability.AutomatedReadability = suggestion
Readability.ColemanLiau = suggestion
Readability.FleschKincaid = suggestion
Readability.FleschReadingEase = suggestion
Readability.GunningFog = suggestion
Readability.LIX = suggestion
Readability.SMOG = suggestion
# Replaced by STE.Semicolon, which reports an exact span and cites Rule 8.1.
ai-tells.SemicolonUsage = NO
# Replaced by STE.NounCluster, which also checks proper nouns and anchors a
# long stack to one alert.
ai-tells.NounString = NO

# Agent-authored prose inside source comments.
[*.{py,ts,tsx,js,go,rs,c,cpp,h,sh}]
BasedOnStyles = ai-tells
ai-tells.SemicolonUsage = NO

# Standalone commit message files.
[commit-msg.txt]
BasedOnStyles = Vale, ai-tells-commits
