# Terminal Colours
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Prefix Key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Enhanced key reporting (lets Shift+Enter etc. pass through to TUIs)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Shift+Enter -> newline for bubbletea TUIs (Crush); tmux lacks the kitty
# keyboard protocol, so inject the CSI-u sequence directly (Crush maintainer's
# recommended workaround)
bind-key -T root S-Enter send-keys Escape "[13;2u"

# Pane and Windows
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# General
set -g detach-on-destroy off # Don't exit tmux on session close
set -sg escape-time 0 # Zero out escape time
set -g history-limit 100000 
set -g set-clipboard on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
