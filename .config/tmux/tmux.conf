# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "desert"

# Terminal Colours

# Prefix Key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Terimal
set -g default-terminal "${TERM}"
set -ga terminal-overrides ",*256col*:Tc"
set -g default-terminal "tmux-256color"

set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# SessionX
set -g @sessionx-bind 'w'
set -g @sessionx-git-branch 'on'
set -g @sessionx-window-mode 'on'

# Shift+Enter -> newline for bubbletea TUIs (Crush); tmux lacks the kitty
# keyboard protocol, so inject the CSI-u sequence directly (Crush maintainer's
# recommended workaround)
bind-key -T root S-Enter send-keys Escape "[13;2u"

# Pane and Windows
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# General
set -g detach-on-destroy off # Don't exit tmux on session close
set -sg escape-time 0 # Zero out escape time
set -g history-limit 100000 
set -g set-clipboard on


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
